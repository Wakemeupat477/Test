services:
  provider:
    image: ${PROVIDER_IMAGE:-gitea.teamlead.one/armanteam_public/mail-provider:1}
    environment:
      CANDIDATE: ${CANDIDATE:?укажите CANDIDATE в файле .env}
    ports:
      - "8080:8080"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:8080/v1/metrics').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 15s

  worker:
    build: .
    depends_on:
      provider:
        condition: service_healthy
    environment:
      PROVIDER_URL: http://provider:8080
      DB_PATH: /data/mail.db
      CANDIDATE: ${CANDIDATE:?укажите CANDIDATE в файле .env}
    volumes:
      - mail-data:/data
    restart: "no"

  exporter:
    build: .
    command: ["node", "--experimental-strip-types", "src/exporter.mts"]
    environment:
      DB_PATH: /data/mail.db
      OUTPUT_PATH: /out/result.jsonl
    volumes:
      - mail-data:/data
      - ./out:/out
    restart: "no"

volumes:
  mail-data:
